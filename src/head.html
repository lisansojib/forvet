<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Forvet — veterinary formulation, costing, materials and commercial pricing." />
  <meta name="theme-color" content="#ffffff" />
  <title>Forvet | Veterinary Formulation &amp; Commercial ERP</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a4ad9'/%3E%3Ctext x='32' y='41' font-family='Arial,sans-serif' font-size='24' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3ERx%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" />
  <!-- Optional deployment config (Supabase URL + anon key). Missing file = local-only mode. -->
  <script src="config.js"></script>
  <style>
/*__TAILWIND__*/
  </style>
  <style>
    body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background-color: #f6f7f9; color: #1f2430; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid #3d65ef; outline-offset: 2px; }
    button:disabled, input:disabled, select:disabled, textarea:disabled { cursor: not-allowed; }
    .ro-lock input:disabled, .ro-lock select:disabled, .ro-lock textarea:disabled { background-color: #f8fafc; color: #334155; opacity: 1; }
    .admin-only[disabled] { opacity: .5; }

    .sec-toggle { border: 1px solid #cbd5e1; border-radius: .5rem; padding: .25rem .55rem; font-size: .7rem; font-weight: 700; color: #334155; background: #f8fafc; white-space: nowrap; }
    .sec-toggle:hover { background: #e2e8f0; }
    section.is-collapsed > .sec-head { border-bottom-width: 0 !important; padding-bottom: 0 !important; }

    /* Formula sheet: never collapse names to one character per line */
    .formula-table { min-width: 760px; table-layout: fixed; }
    .formula-table td, .formula-table th { overflow-wrap: break-word; word-break: normal; }
    .formula-table .col-ing { width: 40%; min-width: 240px; }

    #backToTopBtn { opacity: .3; transition: opacity .15s; }
    #backToTopBtn:hover, #backToTopBtn:focus-visible { opacity: .9; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.6); backdrop-filter: blur(2px); z-index: 50; display: flex; align-items: center; justify-content: center; padding: .75rem; }
    .modal-panel { background: #fff; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,.25); border: 1px solid #e2e8f0; width: 100%; max-height: 92dvh; display: flex; flex-direction: column; overflow: hidden; }
    .modal-body { overflow-y: auto; }
    #uiDialog { z-index: 70; }

    /* Mobile: header scrolls away, a compact nav stays */
    #mobileNav { display: none; }
    @media (max-width: 640px) {
      #appHeader { position: static !important; }
      #mobileNav { display: flex; position: sticky; top: 0; z-index: 30; }
      #backToTopBtn { right: .6rem; bottom: 2.75rem; padding: .55rem .7rem; }
      #backToTopBtn .btt-text { display: none; }
      .modal-backdrop { align-items: flex-end; padding: 0; }
      .modal-panel { border-radius: 1rem 1rem 0 0; max-height: 94dvh; }
    }

    /* Print / PDF export */
    #pdfWatermarkOverlay { display: none; }
    @media print {
      .no-print, #mobileNav, #appHeader, #statusBar { display: none !important; }
      body { background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .print-card { box-shadow: none !important; border: 1px solid #cbd5e1 !important; break-inside: avoid; margin-bottom: 12px !important; }
      .sec-body[hidden] { display: block !important; }
      .print-only { display: block !important; }
      #pdfWatermarkOverlay { display: flex !important; position: fixed; inset: 0; z-index: 9999; pointer-events: none; align-items: center; justify-content: center; overflow: hidden; }
      .watermark-grid { display: flex; flex-direction: column; gap: 140px; transform: rotate(-45deg); opacity: .11; }
      .watermark-text { font-size: 46px; font-weight: 800; color: #064e3b; white-space: nowrap; }
      .overflow-x-auto { overflow: visible !important; }
      .formula-table { min-width: 0; }
    }
    .print-only { display: none; }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
